  * { box-sizing: border-box; }

  html, body {

    padding: 0;

  body {
    display: grid;

    max-width: 34rem;
  }

  .mark {
    display: block;
    width: 68px;
    height: 68px;
    margin: 0 auto 2rem;
  }

  h1 {
    margin: 0;
    font-size: clamp(3rem, 13vw, 5.25rem);

    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--oat);
  }

  .rule {
    width: 44px;
    height: 2px;
    margin: 2.4rem auto;
    border: 0;
    background: var(--oat);
    opacity: 0.55;
  }

  p.notice {
    margin: 0;
    font-size: clamp(1.02rem, 3.2vw, 1.2rem);
    line-height: 1.6;
    color: var(--muted);
  }

    position: fixed;
    left: 0;
    right: 0;
    bottom: 1.4rem;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    color: var(--muted);
    opacity: 0.7;
  }

  @media (max-height: 520px) {
    footer { position: static; margin-top: 2.5rem; }
  }
